<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>AI助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:#0d1117;color:#c9d1d9;height:100vh;display:flex}
.sb{width:240px;background:#161b22;border-right:1px solid #21262d;padding:12px;overflow-y:auto}
.sb h2{font-size:14px;color:#58a6ff;margin-bottom:12px}
.agent{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px;margin:2px 0}.agent:hover{background:#1c2128}.agent.on{background:#1f2937;border:1px solid #30363d}.agent .dot{width:7px;height:7px;border-radius:50%}.agent .check{color:#3fb950;font-size:11px;margin-left:auto}
.sb button{width:100%;margin:4px 0;padding:7px;border-radius:5px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;font-size:12px;cursor:pointer}.sb button.go{background:#238636;border-color:#2ea043;color:#fff}.sb button:hover{opacity:.9}
.main{flex:1;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;padding:10px 16px;border-bottom:1px solid #21262d;background:#161b22;font-size:13px}.top .badge{background:#0d3320;color:#3fb950;padding:2px 8px;border-radius:8px;font-size:11px}
.chat{flex:1;overflow-y:auto;padding:16px}
.msg{margin-bottom:16px;max-width:800px}.msg.usr{display:flex;justify-content:flex-end}.msg.usr .bub{background:#1f2937;padding:10px 14px;border-radius:14px 14px 4px 14px;max-width:75%;font-size:13px;line-height:1.7}
.msg.ai .bub{font-size:13px;line-height:1.8;color:#c9d1d9;padding-left:10px}.msg.ai .head{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px}.msg.ai .head .role{font-weight:600;color:#58a6ff}.msg.ai .head .time{color:#484f58;font-size:10px}
.bub h2,.bub h3{color:#e1e4e8;margin:8px 0 4px}.bub table{width:100%;border-collapse:collapse;margin:6px 0;font-size:12px}.bub th,.bub td{border:1px solid #30363d;padding:4px 8px;text-align:left}.bub th{background:#161b22}.bub pre{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px;overflow-x:auto;font-size:11px;margin:6px 0}.bub code{background:#21262d;padding:1px 4px;border-radius:3px;font-size:12px;color:#d2a8ff}.bub pre code{background:none;padding:0;color:#c9d1d9}.bub li{margin:3px 0;margin-left:16px}
.loading{display:inline-flex;gap:4px;align-items:center;color:#58a6ff;font-size:13px}.loading .d{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:b .6s infinite alternate}.loading .d:nth-child(2){animation-delay:.2s}.loading .d:nth-child(3){animation-delay:.4s}@keyframes b{to{opacity:.2}}
.code-box{border:1px solid #30363d;border-radius:8px;overflow:hidden;margin:8px 0}.code-box .ch{padding:6px 10px;background:#161b22;font-size:11px}.code-box .cb{padding:8px 12px;background:#0d1117;font-size:11px;max-height:300px;overflow-y:auto;font-family:monospace;white-space:pre-wrap}.code-box .cf{padding:6px 10px;background:#161b22;border-top:1px solid #30363d;display:flex;gap:6px}.code-box .cf button{padding:3px 10px;border-radius:4px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;font-size:11px;cursor:pointer}.code-box .cf button.pv{background:#1f6feb;border-color:#388bfd}.code-box .cf button:hover{border-color:#58a6ff}
.pv-frame{width:100%;height:300px;border:1px solid #30363d;border-radius:4px;background:#fff;margin-top:4px;display:none}
.inp{padding:12px 16px;border-top:1px solid #21262d;background:#161b22;display:flex;gap:8px}.inp textarea{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:8px 12px;color:#c9d1d9;font-size:13px;resize:none;outline:none;font-family:inherit;max-height:80px}.inp textarea:focus{border-color:#58a6ff}.inp button{width:36px;height:36px;border-radius:8px;border:none;background:#238636;color:#fff;font-size:16px;cursor:pointer}.inp button:disabled{background:#21262d;color:#484f58}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100}.modal{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;width:480px;max-width:90vw}.modal h3{font-size:15px;margin-bottom:12px}.modal label{display:block;font-size:11px;color:#8b949e;margin:8px 0 3px}.modal input,.modal textarea,.modal select{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:5px;padding:7px 10px;color:#c9d1d9;font-size:12px;outline:none}.modal textarea{resize:vertical;min-height:60px}.modal-acts{display:flex;gap:6px;justify-content:flex-end;margin-top:14px}.modal-acts button{padding:6px 14px;border-radius:5px;font-size:12px;cursor:pointer}.mc{background:#21262d;border:1px solid #30363d;color:#c9d1d1}.ms{background:#238636;border:1px solid #2ea043;color:#fff}
.toast{position:fixed;top:16px;right:16px;padding:8px 14px;border-radius:6px;font-size:12px;z-index:200;animation:ti .3s}@keyframes ti{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}.toast.ok{background:#0d3320;border:1px solid #238636;color:#3fb950}.toast.er{background:#3d1117;border:1px solid #da3633;color:#f85149}
</style></head><body>
<div class="sb"><h2>🤖 AI 智能助手</h2>
<div id="agents"></div>
<div style="margin-top:10px" id="modelArea"></div>
<button class="go" onclick="newAgent()">➕ 新建 Agent</button>
<button onclick="groupChat()">👥 发起群聊</button>
<button onclick="clearAll()">🔄 清空对话</button><button style="background:#1f6feb;border-color:#388bfd;color:#fff" onclick="showCfg()">⚙️ API设置 (已配置)</button>
<div style="font-size:10px;color:#484f58;margin-top:12px" id="footer">5个Agent</div>
</div>
<div class="main">
<div class="top"><span id="title">AI 智能助手</span><span class="badge" id="badge">选择Agent开始</span></div>
<div class="chat" id="chat"></div>
<div class="inp"><textarea id="input" rows="2" placeholder="输入任务..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><button id="sbtn" onclick="send()">➤</button></div>
</div>


<!-- API设置弹窗 -->
<div class="modal-overlay" id="cfgModal"><div class="modal">
<h3>⚙️ API 设置</h3>
<label>API Key</label><input id="cfgKey" type="password" value="voVHB960PuPIgHnHK42wb7q84XnJgd6jhACq009RUSeLWRyQ">
<label>OpenAI地址 (GPT/DeepSeek/Qwen)</label><input id="cfgOAI" value="http://10.16.11.195/v1">
<label>Claude地址</label><input id="cfgClaude" value="http://10.16.11.195">
<div style="font-size:11px;color:#8b949e;margin-top:6px">配置已预填。点击保存后即可调用真实API。</div>
<div class="modal-acts"><button class="mc" onclick="hideM('cfgModal')">取消</button><button class="ms" onclick="saveCfg()">💾 保存并连接</button></div>
</div></div>\n<!-- Agent表单 -->
<div class="modal-overlay" id="agentModal"><div class="modal">
<h3 id="amTitle">新建 Agent</h3>
<label>名称</label><input id="amName" placeholder="如：PRD生成器">
<label>提示词</label><textarea id="amPrompt" rows="4" placeholder="你是..."></textarea>
<label>模型</label><select id="amModel"><option value="claude-sonnet-4-6">Claude Sonnet 4</option><option value="claude-opus-4-6">Claude Opus 4</option><option value="gpt-5.5">GPT-5.5</option><option value="gpt-5.3-codex">GPT-5.3 Codex</option><option value="deepseek-v4-pro">DeepSeek V4 Pro</option><option value="qwen3.6-plus">Qwen 3.6 Plus</option></select>
<div class="modal-acts"><button class="mc" onclick="hideM('agentModal')">取消</button><button class="ms" onclick="saveAgent()">保存</button></div>
</div></div>

<!-- 群聊表单 -->
<div class="modal-overlay" id="groupModal"><div class="modal">
<h3>👥 发起群聊</h3>
<label>主题</label><input id="gmTopic" placeholder="讨论主题">
<label>选择Agent</label><div id="gmAgents" style="max-height:200px;overflow-y:auto"></div>
<div class="modal-acts"><button class="mc" onclick="hideM('groupModal')">取消</button><button class="ms" onclick="startGroup()">开始群聊</button></div>
</div></div>

<div id="toasts"></div>

<script>
// ===== 数据 =====
var A = [
  {id:'_assistant',name:'通用助手',prompt:'全能AI助手',model:'claude-sonnet-4-6',color:'#58a6ff',builtin:true},
  {id:'_prd',name:'PRD文档专家',prompt:'输出结构化PRD文档，含背景、功能表、验收标准',model:'claude-sonnet-4-6',color:'#d4773a',builtin:true},
  {id:'_reviewer',name:'文档审查员',prompt:'审查文档完整性和一致性',model:'gpt-5.5',color:'#b83bd4',builtin:true},
  {id:'_coder',name:'代码工程师',prompt:'输出完整可运行代码，用```包裹',model:'gpt-5.3-codex',color:'#10a37f',builtin:true},
  {id:'_pm',name:'项目经理',prompt:'输出任务拆解、时间线、风险清单',model:'deepseek-v4-pro',color:'#4f46e5',builtin:true}
]
var myA = JSON.parse(localStorage.getItem('ma')||'[]')
function allA(){return A.concat(myA)}
function ga(id){return allA().find(function(a){return a.id===id})}

var chat = {agent:null,msgs:[],mode:'single'}
var editId = null

// ===== 渲染 =====
function render(){
  document.getElementById('agents').innerHTML = allA().map(function(a){return '<div class="agent'+(chat.agent===a.id?' on':'')+'" onclick="sel(\''+a.id+'\')"><span class="dot" style="background:'+a.color+'"></span>'+a.name+(chat.agent===a.id?'<span class="check">✓</span>':'')+(a.builtin?'':'<span style="color:#f85149;font-size:10px;margin-left:auto;cursor:pointer" onclick="event.stopPropagation();del(\''+a.id+'\')">✕</span>')+'</div>'}).join('')
  
  var a = ga(chat.agent)
  document.getElementById('title').textContent = a?a.name+' . 对话':'AI 智能助手'
  document.getElementById('badge').textContent = a?'模型: '+a.model:'选择Agent开始'
  document.getElementById('footer').textContent = allA().length+'个Agent'
  
  var models = [{id:'claude-sonnet-4-6',name:'Claude Sonnet 4',color:'#d4773a'},{id:'claude-opus-4-6',name:'Claude Opus 4',color:'#b83bd4'},{id:'gpt-5.5',name:'GPT-5.5',color:'#10a37f'},{id:'gpt-5.3-codex',name:'GPT-5.3 Codex',color:'#10a37f'},{id:'deepseek-v4-pro',name:'DeepSeek V4 Pro',color:'#4f46e5'},{id:'qwen3.6-plus',name:'Qwen 3.6 Plus',color:'#06b6d4'}]
  document.getElementById('modelArea').innerHTML = chat.agent ? '<div style="font-size:10px;color:#8b949e;margin:8px 0 4px">🔧 模型</div>'+models.map(function(m){return '<div class="agent" onclick="sm(\''+m.id+'\')"><span class="dot" style="background:'+m.color+'"></span>'+m.name+'</div>'}).join('') : ''
  
  renderMsgs()
}

function sel(id){chat.agent=id;chat.mode='single';chat.msgs=[];render()}
function sm(mid){var a=ga(chat.agent);if(a&&!a.builtin){a.model=mid;localStorage.setItem('ma',JSON.stringify(myA));render()}}

// ===== 发送 =====
function send(){
  var t = document.getElementById('input').value.trim()
  if(!t) return
  document.getElementById('input').value = ''
  
  if(chat.mode==='group'){doGroup(t);return}
  if(!chat.agent){alert('请先选择一个Agent');return}
  
  var now = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})
  var a = ga(chat.agent)
  if(!a) return
  
  chat.msgs.push({role:'user',content:t,time:now})
  var aiIdx = chat.msgs.length
  chat.msgs.push({role:'ai',content:'<span class="loading">分析中<span class="d"></span><span class="d"></span><span class="d"></span></span>',time:now,agent:a.name,color:a.color})
  document.getElementById('sbtn').disabled = true
  renderMsgs()
  
  // 用setTimeout模拟分析过程，确保UI先更新
  setTimeout(function(){
    var base = a.model.startsWith('claude-') ? CFG.apiClaude : CFG.apiOAI
if(base && CFG.apiKey){try{var xhr=new XMLHttpRequest();xhr.open('POST',base.replace(/\/\$/,'')+'/chat/completions',false);xhr.setRequestHeader('Content-Type','application/json');xhr.setRequestHeader('Authorization','Bearer '+CFG.apiKey);xhr.send(JSON.stringify({model:a.model,messages:[{role:'system',content:a.prompt},{role:'user',content:t}],max_tokens:2500}));if(xhr.status===200){var d=JSON.parse(xhr.responseText);var r=d.choices[0].message.content}else{var r=mock(a.name,t)}}catch(e){var r=mock(a.name,t)}}else{var r=mock(a.name,t)}
    chat.msgs[aiIdx].content = r
    // 检测代码
    var m = r.match(/```(\w*)\n([\s\S]*?)```/)
    if(m){chat.msgs[aiIdx].code = {code:m[2],lang:m[1]||'plain',html:m[1]==='html'||m[2].indexOf('<!DOCTYPE')>=0||m[2].indexOf('<html')>=0}}
    renderMsgs()
    document.getElementById('sbtn').disabled = false
  }, 600)
}

function doGroup(topic){
  var gs = JSON.parse(localStorage.getItem('gp')||'[]')
  if(gs.length<2){alert('请先发起群聊选择Agent');return}
  
  var now = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})
  chat.msgs.push({role:'user',content:'📢 群聊主题：'+topic,time:now})
  renderMsgs()
  
  var agents = gs.map(ga).filter(Boolean)
  var round = 0
  
  function nextRound(){
    if(round >= 3){
      // 总结
      var host = agents[0]
      var si = chat.msgs.length
      chat.msgs.push({role:'ai',content:'',time:now,agent:host.name+' 📋总结',color:host.color})
      renderMsgs()
      setTimeout(function(){
        chat.msgs[si].content = '<h3>📋 群聊总结</h3><p>'+agents.length+'位Agent就"'+topic+'"进行了3轮讨论。核心结论：<br>1. 产品侧聚焦3个核心场景<br>2. 技术侧采用Vue3+微服务架构<br>3. 管理侧分阶段推进，每阶段2周</p><p><em>配置API后Agent可进行真正讨论</em></p>'
        renderMsgs()
      },400)
      return
    }
    var a = agents[round % agents.length]
    var si = chat.msgs.length
    chat.msgs.push({role:'ai',content:'<span class="loading">思考中<span class="d"></span><span class="d"></span><span class="d"></span></span>',time:now,agent:a.name,color:a.color})
    renderMsgs()
    setTimeout(function(){
      chat.msgs[si].content = gm(a.name, a.id, round)
      renderMsgs()
      round++
      setTimeout(nextRound, 400)
    }, 400)
  }
  nextRound()
}

// ===== Mock =====
function mock(name, msg){
  if(name.indexOf('PRD')>=0||name.indexOf('产品')>=0){
    return '## 产品需求文档（PRD）\n\n**文档编号**：PRD-2026-0526\n**版本**：V1.0\n\n### 一、背景\n基于业务需要，需要输出结构化的产品需求文档。\n\n### 二、功能列表\n\n| 优先级 | 功能 | 说明 | 工时 |\n|-------|------|------|------|\n| P0 | 核心功能 | 必须实现 | 3天 |\n| P1 | 增强功能 | 提升体验 | 2天 |\n| P2 | 优化项 | 后续迭代 | 1天 |\n\n### 三、验收标准\n- [ ] P0功能通过测试\n- [ ] 异常场景有兜底\n- [ ] 性能满足要求\n\n> 模拟回复。配置API后可得真实AI生成内容。'
  }
  if(name.indexOf('审查')>=0){
    return '## 文档审查报告\n\n### 完整性\n✅ 核心章节完整\n⚠️ 缺少异常流程\n⚠️ 缺少性能指标\n\n### 一致性\n✅ 术语统一\n⚠️ 评分区间不一致\n\n**总评**：7.5/10'
  }
  if(name.indexOf('代码')>=0||name.indexOf('coder')>=0){
    return '```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset="UTF-8">\n<title>Demo</title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{font-family:sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;align-items:center;justify-content:center}\n.card{background:#fff;border-radius:16px;padding:40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}\nh1{color:#333;margin-bottom:12px}p{color:#666;line-height:1.6}\n.btn{display:inline-block;margin-top:16px;padding:12px 28px;background:#667eea;color:#fff;border-radius:8px;text-decoration:none}\n</style>\n</head>\n<body>\n<div class="card">\n<h1>🤖 AI 生成页面</h1>\n<p>这是代码工程师Agent生成的演示页面。</p>\n<a href="#" class="btn">开始使用</a>\n</div>\n</body>\n</html>\n```\n\n> 模拟代码。点👁️预览查看效果。'
  }
  if(name.indexOf('项目')>=0||name.indexOf('经理')>=0){
    return '## 项目计划\n\n### 任务拆解\n| 阶段 | 任务 | 时间 |\n|------|------|------|\n| 1 | 需求确认 | 3天 |\n| 2 | 核心开发 | 5天 |\n| 3 | 联调测试 | 3天 |\n| 4 | 修复上线 | 2天 |\n\n### 风险\n🔴 外部依赖可能延期\n🟡 测试人力不足\n🟢 UI调整可控'
  }
  return '好的，我收到了你的需求："'+msg.substring(0,40)+'..."\n\n从以下几个方面分析：\n\n1. **需求理解**：首先明确核心目标\n2. **方案建议**：基于现有架构给出最优方案\n3. **实施步骤**：拆分为可执行的步骤\n4. **注意事项**：提前识别风险点\n\n> 模拟回复。配置API后可得真实AI生成。'
}

function gm(name, id, round){
  var m = {
    _prd:['从产品角度看，建议聚焦3个核心用户场景，先做深再做广。','补充：竞品分析也很关键，特别是金融行业。','总结：产品侧优先做深核心场景。'],
    _reviewer:['审查发现：数据安全和异常流程需补充。','权限控制方案还需要细化。'],
    _coder:['技术架构用Vue3+SpringBoot，API用RESTful。','代码层面做好模块化便于维护。'],
    _pm:['从项目角度，建议分3个迭代，每轮2周。','风险：设备联调是关键路径。'],
    _assistant:['这个话题很有价值，建议先明确目标再分解。','团队协作方面，日报+看板能有效同步。']
  }
  var arr = m[id]||m._assistant
  return arr[round % arr.length]
}

// ===== Agent管理 =====
function newAgent(id){
  editId = id||null
  document.getElementById('amTitle').textContent = id?'编辑 Agent':'新建 Agent'
  var a = id?ga(id):null
  document.getElementById('amName').value = a?a.name:''
  document.getElementById('amPrompt').value = a?a.prompt:''
  if(a) document.getElementById('amModel').value = a.model
  document.getElementById('agentModal').style.display='flex'
}
function saveAgent(){
  var name = document.getElementById('amName').value.trim()
  var prompt = document.getElementById('amPrompt').value.trim()
  if(!name){alert('请输入名称');return}
  var colors = ['#d4773a','#10a37f','#6e40c9','#f59e0b','#06b6d4']
  if(editId){
    var i = myA.findIndex(function(a){return a.id===editId})
    if(i>=0){myA[i].name=name;myA[i].prompt=prompt;myA[i].model=document.getElementById('amModel').value}
  }else{
    myA.push({id:'a'+Date.now(),name:name,prompt:prompt,model:document.getElementById('amModel').value,color:colors[myA.length%5],builtin:false})
  }
  localStorage.setItem('ma',JSON.stringify(myA))
  hideM('agentModal');editId=null;render()
}
function del(id){myA=myA.filter(function(a){return a.id!==id});localStorage.setItem('ma',JSON.stringify(myA));if(chat.agent===id){chat.agent=null;chat.msgs=[]};render()}
function groupChat(){
  document.getElementById('gmAgents').innerHTML = allA().map(function(a){return '<label style="display:flex;align-items:center;gap:6px;padding:3px 0;font-size:13px;cursor:pointer"><input type="checkbox" value="'+a.id+'"><span class="dot" style="background:'+a.color+';width:7px;height:7px;border-radius:50%"></span>'+a.name+'</label>'}).join('')
  document.getElementById('groupModal').style.display='flex'
}
function startGroup(){
  var checked = Array.from(document.querySelectorAll('#gmAgents input:checked')).map(function(c){return c.value})
  if(checked.length<2){alert('至少选2个Agent');return}
  localStorage.setItem('gp',JSON.stringify(checked))
  hideM('groupModal')
  chat.mode='group';chat.agent=null;chat.msgs=[]
  document.getElementById('title').textContent = '👥 群聊 . '+checked.length+' Agent'
  render()
  var topic = document.getElementById('gmTopic').value.trim()
  if(topic) document.getElementById('input').value = topic
}
var CFG = JSON.parse(localStorage.getItem('ai_cfg')||'{"apiKey":"voVHB960PuPIgHnHK42wb7q84XnJgd6jhACq009RUSeLWRyQ","apiOAI":"http://10.16.11.195/v1","apiClaude":"http://10.16.11.195"}')
function showCfg(){document.getElementById('cfgKey').value=CFG.apiKey||'';document.getElementById('cfgOAI').value=CFG.apiOAI||'';document.getElementById('cfgClaude').value=CFG.apiClaude||'';document.getElementById('cfgModal').style.display='flex'}
function saveCfg(){CFG.apiKey=document.getElementById('cfgKey').value.trim();CFG.apiOAI=document.getElementById('cfgOAI').value.trim();CFG.apiClaude=document.getElementById('cfgClaude').value.trim();localStorage.setItem('ai_cfg',JSON.stringify(CFG));hideM('cfgModal')}
function clearAll(){chat.msgs=[];render()}
function hideM(id){document.getElementById(id).style.display='none'}

// ===== 渲染消息 =====
function renderMsgs(){
  var el = document.getElementById('chat')
  el.innerHTML = chat.msgs.map(function(m,i){
    if(m.role==='user') return '<div class="msg usr"><div class="bub">'+md(m.content)+'</div></div>'
    var c = m.color||'#58a6ff'
    var h = '<div class="msg ai"><div class="head"><span class="role" style="color:'+c+'">🤖 '+m.agent+'</span><span class="time">'+m.time+'</span></div>'
    if(m.code){
      h+='<div class="code-box"><div class="ch">📄 '+m.code.lang+' . '+m.code.code.split('\n').length+'行</div><div class="cb">'+esc(m.code.code)+'</div><div class="cf"><button onclick="navigator.clipboard.writeText(`'+esc(m.code.code).replace(/`/g,'\\`')+'`)">📋 复制</button>'+(m.code.html?'<button class="pv" onclick="pv('+i+')">👁️ 预览</button>':'')+'</div><div class="pv-frame" id="pv-'+i+'"></div></div>'
    }
    h+='<div class="bub">'+md(m.content)+'</div></div>'
    return h
  }).join('')
  el.scrollTop = el.scrollHeight
}
function md(s){return s?String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/```[\s\S]*?```/g,'').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'<br><br>').replace(/\|(.+)\|/g,function(m){return m.indexOf('---')>=0?'':'<tr>'+m.split('|').filter(function(c){return c.trim()}).map(function(c){return '<td>'+c.trim()+'</td>'}).join('')+'</tr>'}).replace(/^- (.+)/gm,'<li>$1</li>'):''}
function esc(s){return s.replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function pv(i){var el=document.getElementById('pv-'+i);if(!el)return;el.style.display='block';el.innerHTML='<iframe srcdoc="'+chat.msgs[i].code.code.replace(/"/g,'&quot;')+'" style="width:100%;height:300px;border:none"></iframe>'}

// 初始化
render()
renderMsgs()
</script>
</body></html>
