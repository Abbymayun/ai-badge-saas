<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 智能助手 · 利尔达企业版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#0d1117;color:#c9d1d9;height:100vh;display:flex;overflow:hidden}

.sidebar{width:260px;background:#161b22;border-right:1px solid #21262d;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-header{padding:14px 16px;border-bottom:1px solid #21262d}.sb-header h1{font-size:15px;color:#58a6ff}.sb-header p{font-size:10px;color:#8b949e;margin-top:2px}
.sb-section{padding:10px 14px;border-bottom:1px solid #21262d}.sb-stitle{font-size:10px;color:#8b949e;text-transform:uppercase;margin-bottom:6px;letter-spacing:.5px}
.sb-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:12px;margin:1px 0;transition:.1s}.sb-item:hover{background:#1c2128}.sb-item.active{background:#1f2937;border:1px solid #30363d}.sb-item-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}.sb-item-name{flex:1;color:#c9d1d9}.sb-item-tag{font-size:9px;padding:1px 5px;border-radius:3px;background:#21262d;color:#8b949e}.sb-item-check{color:#3fb950;font-size:11px}
.sb-actions{padding:10px 14px;display:flex;flex-direction:column;gap:5px}
.sb-btn{width:100%;padding:7px 10px;border-radius:5px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;font-size:11px;cursor:pointer;text-align:left}.sb-btn:hover{background:#30363d;border-color:#58a6ff}
.sb-btn.primary{background:#238636;border-color:#2ea043;color:#fff}.sb-btn.primary:hover{background:#2ea043}
.sb-footer{padding:10px 14px;border-top:1px solid #21262d;font-size:10px;color:#484f58;margin-top:auto}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:8px 16px;border-bottom:1px solid #21262d;display:flex;align-items:center;justify-content:space-between;background:#161b22}
.topbar-title{font-size:13px;font-weight:600}
.topbar-badge{padding:2px 8px;border-radius:8px;font-size:10px;border:1px solid #30363d}
.topbar-badge.online{background:#0d3320;color:#3fb950;border-color:#238636}
.topbar-badge.offline{background:#1f2937;color:#8b949e}
.mode-tabs{display:flex;gap:0}
.mode-tab{padding:6px 14px;font-size:12px;cursor:pointer;color:#8b949e;border-bottom:2px solid transparent}.mode-tab:hover{color:#c9d1d9}.mode-tab.active{color:#58a6ff;border-bottom-color:#58a6ff}

.msg-area{flex:1;overflow-y:auto;padding:16px}
.msg{display:flex;gap:10px;margin-bottom:16px;max-width:880px}
.msg.user{flex-direction:row-reverse;align-self:flex-end}
.msg-av{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.msg.user .msg-av{background:#238636}.msg.ai-1 .msg-av{background:#1f6feb}.msg.ai-2 .msg-av{background:#6e40c9}.msg.ai-3 .msg-av{background:#d4773a}.msg.ai-4 .msg-av{background:#10a37f}
.msg-body{flex:1;min-width:0}
.msg-head{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px}.msg.user .msg-head{justify-content:flex-end}
.msg-role{font-weight:600}.msg.user .msg-role{color:#7ee787}.msg.ai-1 .msg-role{color:#58a6ff}.msg.ai-2 .msg-role{color:#d2a8ff}.msg.ai-3 .msg-role{color:#f0883e}.msg.ai-4 .msg-role{color:#3fb950}
.msg-time{color:#484f58;font-size:10px}
.msg-content{font-size:13px;line-height:1.7;color:#c9d1d9}.msg.user .msg-content{background:#1f2937;padding:10px 14px;border-radius:14px 14px 4px 14px;display:inline-block;max-width:80%}
.msg-content pre{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:10px;overflow-x:auto;font-size:11px;line-height:1.5;margin:6px 0}.msg-content code{background:#21262d;padding:1px 5px;border-radius:3px;font-size:12px;color:#d2a8ff}.msg-content pre code{background:transparent;padding:0;color:#c9d1d9}

.think-box{margin:6px 0;border:1px solid #21262d;border-radius:6px;overflow:hidden}.think-head{padding:6px 10px;background:#161b22;font-size:11px;color:#d2a8ff;cursor:pointer}.think-body{padding:8px 12px;font-size:11px;color:#8b949e;line-height:1.6;border-top:1px solid #21262d;display:none}.think-box.open .think-body{display:block}

.code-module{margin:8px 0;border:1px solid #30363d;border-radius:8px;overflow:hidden}.code-module-header{padding:6px 12px;background:#161b22;font-size:11px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #30363d}.code-module-body{padding:10px;font-size:12px;line-height:1.5;background:#0d1117;max-height:400px;overflow-y:auto;font-family:'Consolas','Monaco',monospace;white-space:pre-wrap}.code-module-actions{display:flex;gap:6px;padding:6px 12px;background:#161b22;border-top:1px solid #30363d}.code-btn{padding:4px 12px;border-radius:4px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;font-size:11px;cursor:pointer}.code-btn:hover{border-color:#58a6ff}.code-btn.primary{background:#238636;border-color:#2ea043}.code-btn.preview{background:#1f6feb;border-color:#388bfd}

.preview-iframe{width:100%;height:300px;border:1px solid #30363d;border-radius:4px;background:#fff;margin-top:6px}

.typing{display:flex;gap:3px;padding:6px 0}.typing span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:typing 1.4s infinite}.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}@keyframes typing{0%,60%,100%{opacity:.3}30%{opacity:1}}

.input-area{padding:12px 16px;border-top:1px solid #21262d;background:#161b22;display:flex;gap:8px;align-items:flex-end}
.input-area textarea{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:8px 12px;color:#c9d1d9;font-size:13px;line-height:1.5;resize:none;outline:none;font-family:inherit;max-height:100px}.input-area textarea:focus{border-color:#58a6ff}
.input-area button{width:36px;height:36px;border-radius:8px;border:1px solid #30363d;background:#238636;color:#fff;font-size:16px;cursor:pointer;flex-shrink:0}.input-area button:hover{background:#2ea043}.input-area button:disabled{background:#21262d;color:#484f58}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:20px;width:500px;max-width:90vw;max-height:80vh;overflow-y:auto}.modal h3{font-size:15px;margin-bottom:12px}.modal label{display:block;font-size:11px;color:#8b949e;margin:8px 0 3px}.modal input,.modal textarea,.modal select{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:5px;padding:7px 10px;color:#c9d1d9;font-size:12px;outline:none;font-family:inherit}.modal textarea{resize:vertical;min-height:60px}.modal-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:14px}.modal-actions button{padding:6px 14px;border-radius:5px;font-size:12px;cursor:pointer}
.modal-btn-c{background:#21262d;border:1px solid #30363d;color:#c9d1d1}.modal-btn-s{background:#238636;border:1px solid #2ea043;color:#fff}

.toast{position:fixed;top:16px;right:16px;padding:8px 14px;border-radius:6px;font-size:12px;z-index:200;animation:in .3s}@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}.toast.ok{background:#0d3320;border:1px solid #238636;color:#3fb950}.toast.err{background:#3d1117;border:1px solid #da3633;color:#f85149}.toast.i{background:#0d213b;border:1px solid #1f6feb;color:#58a6ff}

.empty-state{text-align:center;padding:60px 20px;color:#484f58}.empty-icon{font-size:48px;margin-bottom:12px}.empty-state h3{color:#8b949e;margin-bottom:6px}.empty-state p{font-size:12px;margin-bottom:12px}
.quick-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.quick-btn{padding:6px 14px;border-radius:14px;border:1px solid #30363d;font-size:12px;cursor:pointer;color:#8b949e;transition:.15s}.quick-btn:hover{border-color:#58a6ff;color:#c9d1d9;background:#1c2128}

.group-msg{border-left:3px solid #6e40c9;padding-left:10px;margin:8px 0}
.group-agent-tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:10px;margin-right:4px;margin-bottom:4px}
</style>
</head>
<body>

<!-- 侧边栏 -->
<div class="sidebar">
  <div class="sb-header"><h1>🤖 AI 智能助手</h1><p>利尔达 · 多Agent协同</p></div>
  
  <div class="sb-section">
    <div class="sb-stitle">📋 对话模式</div>
    <div class="mode-tabs" style="flex-direction:column;gap:2px">
      <div class="sb-item" :class="{active:mode==='single'}" onclick="switchMode('single')">💬 单Agent对话</div>
      <div class="sb-item" :class="{active:mode==='group'}" onclick="switchMode('group')">👥 Agent群聊</div>
      <div class="sb-item" :class="{active:mode==='code'}" onclick="switchMode('code')">💻 代码生成</div>
    </div>
  </div>

  <div class="sb-section">
    <div class="sb-stitle">🤖 我的Agent</div>
    <div id="agentList"></div>
  </div>

  <div class="sb-section" id="modelSelection" style="display:none">
    <div class="sb-stitle">🔧 可用模型</div>
    <div id="modelList"></div>
  </div>

  <div class="sb-actions">
    <button class="sb-btn primary" onclick="showNewAgent()">➕ 新建 Agent</button>
    <button class="sb-btn" onclick="showGroupChat()">👥 发起群聊</button>
    <button class="sb-btn" onclick="showSettings()">⚙️ 设置</button>
    <button class="sb-btn" onclick="newChat()">🔄 清空对话</button>
  </div>
  <div class="sb-footer" id="statusFooter">🟢 就绪 · 3个Agent</div>
</div>

<!-- 主区域 -->
<div class="main">
  <div class="topbar">
    <span class="topbar-title" id="chatTitle">新对话</span>
    <div style="display:flex;gap:6px">
      <span class="topbar-badge online" id="modeBadge">💬 单Agent</span>
      <span class="topbar-badge" id="agentBadge">Claude Sonnet 4</span>
    </div>
  </div>

  <div class="msg-area" id="msgArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🧠</div>
      <h3>AI 智能助手 · 多Agent协同</h3>
      <p>创建专属Agent · 拉群讨论 · 代码生成与预览</p>
      <div class="quick-btns">
        <span class="quick-btn" onclick="quickStart('prd')">📝 生成PRD文档</span>
        <span class="quick-btn" onclick="quickStart('group')">👥 Agent群聊讨论</span>
        <span class="quick-btn" onclick="quickStart('code')">💻 写一个网页</span>
      </div>
    </div>
  </div>

  <div class="input-area">
    <textarea id="msgInput" rows="2" placeholder="输入任务..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <button id="sendBtn" onclick="send()">➤</button>
  </div>
</div>

<!-- 新建Agent弹窗 -->
<div class="modal-overlay" id="agentModal" style="display:none">
  <div class="modal"><h3 id="agentModalTitle">新建 Agent</h3>
    <label>名称</label><input type="text" id="agentName" placeholder="如：PRD文档生成器">
    <label>角色描述</label><input type="text" id="agentRole" placeholder="如：你是一个专业的产品经理，擅长写PRD文档">
    <label>系统提示词</label><textarea id="agentPrompt" rows="4" placeholder="详细的系统提示词..."></textarea>
    <label>默认模型</label><select id="agentModel"></select>
    <div class="modal-actions">
      <button class="modal-btn-c" onclick="hideAgentModal()">取消</button>
      <button class="modal-btn-s" onclick="saveAgent()">保存</button>
    </div>
  </div>
</div>

<!-- 群聊弹窗 -->
<div class="modal-overlay" id="groupModal" style="display:none">
  <div class="modal"><h3>👥 发起 Agent 群聊</h3>
    <label>群聊主题</label><input type="text" id="groupTopic" placeholder="如：讨论AI胸牌的定价策略">
    <label>选择参与 Agent（多选）</label>
    <div id="groupAgentCheckboxes" style="max-height:200px;overflow-y:auto"></div>
    <label>讨论轮数</label><select id="groupRounds"><option value="2">2轮</option><option value="3" selected>3轮</option><option value="4">4轮</option><option value="5">5轮</option></select>
    <div class="modal-actions">
      <button class="modal-btn-c" onclick="document.getElementById('groupModal').style.display='none'">取消</button>
      <button class="modal-btn-s" onclick="startGroupChat()">开始群聊</button>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal-overlay" id="settingsModal" style="display:none">
  <div class="modal"><h3>⚙️ 设置</h3>
    <label>API Key</label><input type="password" id="apiKey">
    <label>OpenAI地址</label><input type="text" id="apiBaseOAI" placeholder="http://10.16.11.195/v1">
    <label>Claude地址</label><input type="text" id="apiBaseClaude" placeholder="http://10.16.11.195">
    <div class="modal-actions">
      <button class="modal-btn-c" onclick="document.getElementById('settingsModal').style.display='none'">取消</button>
      <button class="modal-btn-s" onclick="saveCfg()">保存</button>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
// ============ 数据模型 ============
const BUILTIN_MODELS = [
  {id:'claude-sonnet-4-6',name:'Claude Sonnet 4',color:'#d4773a'},
  {id:'claude-opus-4-6',name:'Claude Opus 4',color:'#b83bd4'},
  {id:'gpt-5.5',name:'GPT-5.5',color:'#10a37f'},
  {id:'gpt-5.3-codex',name:'GPT-5.3 Codex',color:'#10a37f'},
  {id:'deepseek-v4-pro',name:'DeepSeek V4 Pro',color:'#4f46e5'},
  {id:'deepseek-r1',name:'DeepSeek R1',color:'#4f46e5'},
  {id:'qwen3.6-plus',name:'Qwen 3.6 Plus',color:'#06b6d4'},
  {id:'MiniMax-M2.7',name:'MiniMax M2.7',color:'#f59e0b'}
]

let cfg = JSON.parse(localStorage.getItem('ai_cfg')||'{}')
let agents = JSON.parse(localStorage.getItem('ai_agents')||'[]')
let curChat = {mode:'single',agent:null,msgs:[]}
let mode = 'single'
let editingAgentId = null

// 默认Agent
const DEFAULT_AGENTS = [
  {id:'_assistant',name:'通用助手',role:'通用AI助手',prompt:'你是一个全能的AI助手。',model:'claude-sonnet-4-6',color:'#58a6ff',builtin:true},
  {id:'_prd',name:'PRD文档专家',role:'产品经理',prompt:'你是资深产品经理。擅长输出结构化的PRD文档，包括背景、目标、功能列表、验收标准。',model:'claude-sonnet-4-6',color:'#d4773a',builtin:true},
  {id:'_reviewer',name:'文档审查员',role:'技术文档审查',prompt:'你是文档审查专家。检查文档的完整性、一致性、可行性，指出遗漏和矛盾。',model:'gpt-5.5',color:'#b83bd4',builtin:true},
  {id:'_coder',name:'代码工程师',role:'全栈开发',prompt:'你是一个资深全栈工程师。写代码时输出完整的可运行代码，用```包裹。',model:'gpt-5.3-codex',color:'#10a37f',builtin:true},
  {id:'_pm',name:'项目经理',role:'项目管理',prompt:'你是项目经理。擅长任务拆解、排期、风险识别、资源协调。',model:'deepseek-v4-pro',color:'#4f46e5',builtin:true}
]

function getAllAgents(){return [...DEFAULT_AGENTS,...agents]}
function getAgent(id){return getAllAgents().find(a=>a.id===id)}

// ============ 渲染 ============
function renderAll(){
  renderAgents()
  renderModels()
  renderMsgs()
  updateStatus()
  document.getElementById('modelSelection').style.display = mode==='single'?'':'block'
  document.getElementById('modeBadge').textContent = mode==='single'?'💬 单Agent':mode==='group'?'👥 群聊':'💻 代码'
  document.getElementById('agentBadge').textContent = curChat.agent ? getAgent(curChat.agent)?.name : '选择Agent'
}
function renderAgents(){
  const all = getAllAgents()
  document.getElementById('agentList').innerHTML = all.map(a=>`
    <div class="sb-item ${curChat.agent===a.id?'active':''}" onclick="selectAgent('${a.id}')">
      <span class="sb-item-dot" style="background:${a.color}"></span>
      <span class="sb-item-name">${a.name}</span>
      ${!a.builtin?`<span style="font-size:10px;cursor:pointer;color:#f85149" onclick="event.stopPropagation();deleteAgent('${a.id}')">✕</span>`:''}
    </div>`).join('')
}
function renderModels(){
  document.getElementById('modelList').innerHTML = BUILTIN_MODELS.map(m=>`
    <div class="sb-item" onclick="setAgentModel('${m.id}')">
      <span class="sb-item-dot" style="background:${m.color}"></span><span class="sb-item-name">${m.name}</span>
    </div>`).join('')
}
function selectAgent(id){curChat.agent=id;curChat.msgs=[];mode='single';renderAll();renderMsgs()}
function setAgentModel(mid){if(!curChat.agent)return;const a=getAgent(curChat.agent);if(a&&!a.builtin){a.model=mid;saveAgents();renderAll()}}
function switchMode(m){mode=m;curChat.msgs=[];renderAll();renderMsgs()}
function updateStatus(){
  document.getElementById('statusFooter').innerHTML = `🟢 就绪 · ${getAllAgents().length}个Agent`
  document.getElementById('chatTitle').textContent = curChat.agent ? `${getAgent(curChat.agent)?.name} · 对话` : '新对话'
}

// ============ 发送消息 ============
async function send(){
  const t = document.getElementById('msgInput').value.trim()
  if(!t){return}
  document.getElementById('msgInput').value=''
  document.getElementById('sendBtn').disabled=true

  if(mode==='group'){
    await doGroupChat(t)
  }else if(mode==='code'){
    await doCodeGen(t)
  }else{
    await doSingleChat(t)
  }
  document.getElementById('sendBtn').disabled=false
}

async function doSingleChat(t){
  if(!curChat.agent) return toast('请先在左侧选择一个Agent','err')
  const now = ts()
  curChat.msgs.push({role:'user',content:t,time:now})
  renderMsgs()
  
  const agent = getAgent(curChat.agent)
  curChat.msgs.push({role:'assistant',content:'',time:now,agentId:agent.id,agentName:agent.name,agentColor:agent.color})
  renderMsgs()
  
  try{
    const r = await api(agent.model, agent.prompt, t, 2000, agent.name)
    curChat.msgs[curChat.msgs.length-1].content = r
    // 检测代码块
    if(r.includes('```') && (r.includes('html')||r.includes('javascript')||r.includes('<!DOCTYPE'))){
      const cm = extractCode(r)
      if(cm) curChat.msgs[curChat.msgs.length-1].codeBlock = cm
    }
  }catch(e){curChat.msgs[curChat.msgs.length-1].content = `❌ ${e.message}`}
  renderMsgs()
}

async function doGroupChat(t){
  const selected = JSON.parse(localStorage.getItem('group_agents')||'[]')
  if(!selected.length) return toast('请先点击👥发起群聊选择Agent','err')
  
  curChat.msgs.push({role:'user',content:`【群聊主题】${t}`,time:ts(),isTopic:true})
  renderMsgs()
  
  const topic = t; const rounds = parseInt(document.getElementById('groupRounds')?.value||'3')

  // No API configured → use simulation
  if(!cfg.apiKey||!cfg.apiOAI){
    await simulateGroupChat(topic, selected, rounds)
    return
  }
  
  let context = `群聊主题: ${topic}\n`
  for(let r=0; r<rounds; r++){
    for(const aid of selected){
      const agent = getAgent(aid); if(!agent) continue
      const prompt = `你正在参加AI Agent群聊。讨论主题: ${topic}\n之前的讨论:\n${context}\n现在轮到你发言（100-200字）。`
      curChat.msgs.push({role:'assistant',content:'思考中...',time:ts(),agentId:agent.id,agentName:agent.name,agentColor:agent.color})
      const idx = curChat.msgs.length-1; renderMsgs()
      try{const r=await api(agent.model,agent.prompt,prompt,500,agent.name);curChat.msgs[idx].content=r;context+=`[${agent.name}]:${r}\n`}catch(e){curChat.msgs[idx].content=`❌ ${e.message}`}
      renderMsgs();await sleep(300)
    }
  }
  const host=getAgent(selected[0]);curChat.msgs.push({role:'assistant',content:'📋 汇总中...',time:ts(),agentId:host.id,agentName:host.name+' (总结)',agentColor:host.color,isSummary:true})
  const si=curChat.msgs.length-1;renderMsgs()
  try{curChat.msgs[si].content='## 📋 群聊总结\n\n'+await api(host.model,host.prompt,`请总结群聊核心观点:\n${context}`,800)}catch(e){curChat.msgs[si].content='❌ 总结失败'}
  renderMsgs()
}

async function doCodeGen(t){
  if(!curChat.agent) curChat.agent = '_coder'
  curChat.msgs.push({role:'user',content:t,time:ts()}); renderMsgs()
  const agent = getAgent(curChat.agent)
  curChat.msgs.push({role:'assistant',content:'',time:ts(),agentId:agent.id,agentName:agent.name,agentColor:agent.color})
  const ci = curChat.msgs.length-1; renderMsgs()
  try{
    const prompt = `请根据以下需求生成完整的可运行代码。如果是网页，输出完整HTML。如果是其他代码，输出完整文件。用\`\`\`包裹代码块。\n\n需求: ${t}`
    const r = await api(agent.model, agent.prompt, prompt, 3000)
    curChat.msgs[ci].content = r
    const cm = extractCode(r); if(cm) curChat.msgs[ci].codeBlock = cm
  }catch(e){curChat.msgs[ci].content = `❌ ${e.message}`}
  renderMsgs()
}

function extractCode(text){
  const m = text.match(/```(\w*)\n([\s\S]*?)```/)
  if(!m) return null
  const code = m[2]; const lang = m[1]||'plain'
  const isHTML = lang==='html'||code.includes('<!DOCTYPE')||code.includes('<html')
  return {code,lang,isHTML}
}

// ============ API ============
async function api(model, systemPrompt, userMsg, maxT=2000, agentName=''){
  const base = model.startsWith('claude-') ? (cfg.apiClaude||'') : (cfg.apiOAI||'')
  if(!base||!cfg.apiKey) return mockResponse(userMsg, agentName)
  try{
    const r=await fetch(`${base.replace(/\/$/,'')}/chat/completions`,{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${cfg.apiKey}`},
      body:JSON.stringify({model,temperature:0.7,max_tokens:maxT,messages:[{role:'system',content:systemPrompt},{role:'user',content:userMsg}]})})
    if(!r.ok) throw new Error(`HTTP ${r.status}`)
    const d=await r.json();return d.choices?.[0]?.message?.content||''
  }catch(e){return mockResponse(userMsg, agentName)}
}

// 群聊模拟
async function simulateGroupChat(topic, selectedAgents, rounds){
  const agentMsgs = {
    '_prd': ['从产品角度来看，这个需求需要更清晰的用户场景定义。我建议先梳理核心用户路径。','我补充一下，竞品分析这块也很重要，特别是银行和汽车行业的对标产品。','总结一下：产品侧建议聚焦3个核心场景，先做深再做广。'],
    '_reviewer': ['我审查了一下目前的方案，有几个点需要补充：数据安全合规、异常流程处理、性能指标。','另外权限控制这块的方案不够细，需要区分管理员和普通用户的操作边界。'],
    '_pm': ['从项目管理角度，建议分3个迭代：P0核心功能→P1增强→P2优化。每个迭代2周。','风险点：依赖设备端联调，建议提前预约联调时间窗口。','资源方面，目前前端1人+后端1人，测试需要增配。'],
    '_coder': ['技术实现上，建议用微服务架构，前端Vue3+后端SpringBoot。数据库选MySQL+Redis。','API设计要RESTful，接口文档用Swagger自动生成。前端组件库继续用Element Plus。'],
    '_assistant': ['这是一个很好的讨论方向。我建议先明确目标，再分解任务，最后评估资源。','团队协作方面，建议建立日报机制和周进度看板，确保信息同步。']
  }
  
  const msgs = agentMsgs
  let context = `群聊主题: ${topic}\n`
  
  for(let r=0; r<Math.min(rounds,3); r++){
    for(const aid of selectedAgents){
      const agent = getAgent(aid); if(!agent||!msgs[aid]) continue
      const msg = msgs[aid][(r*selectedAgents.length + selectedAgents.indexOf(aid)) % msgs[aid].length]
      curChat.msgs.push({role:'assistant',content:msg,time:ts(),agentId:agent.id,agentName:agent.name,agentColor:agent.color})
      context += `[${agent.name}]: ${msg}\n`
      renderMsgs(); await sleep(400)
    }
  }
  
  // 总结
  const host = getAgent(selectedAgents[0])
  curChat.msgs.push({role:'assistant',content:`## 📋 群聊总结\n\n经过${rounds}轮讨论，${selectedAgents.length}位Agent围绕"${topic}"达成以下共识：\n\n1. **产品侧**：聚焦3个核心场景，先做深再做广\n2. **技术侧**：Vue3+SpringBoot微服务架构\n3. **管理侧**：3迭代开发，每轮2周\n4. **风险**：设备联调是关键路径，需提前预约\n\n> ⚠️ 模拟群聊。配置API后Agent会进行真正的多轮讨论。`,time:ts(),agentId:host.id,agentName:host.name+' (总结)',agentColor:host.color,isSummary:true})
  renderMsgs()
}

// ============ 渲染消息 ============
function renderMsgs(){
  const area = document.getElementById('msgArea')
  const empty = document.getElementById('emptyState')
  if(!curChat.msgs.length){empty.style.display='';area.innerHTML='';area.appendChild(empty);return}
  empty.style.display='none'
  
  area.innerHTML = curChat.msgs.map((m,i)=>{
    if(m.role==='user'){
      const label = m.isTopic ? '📢 群聊主题' : '你'
      return `<div class="msg user"><div class="msg-av">👤</div><div class="msg-body"><div class="msg-head"><span class="msg-role">${label}</span><span class="msg-time">${m.time}</span></div><div class="msg-content">${esc(m.content)}</div></div></div>`
    }
    const cls = `ai-${(i%4)+1}`;const color = m.agentColor||'#58a6ff'
    let h=`<div class="msg ${cls}"><div class="msg-av" style="background:${color}">🤖</div><div class="msg-body"><div class="msg-head"><span class="msg-role">${m.agentName||'Agent'}</span>${m.isSummary?' <span style="font-size:10px;color:#d2a8ff">📋 总结</span>':''}<span class="msg-time">${m.time}</span></div>`
    if(m.codeBlock){
      h+=`<div class="code-module"><div class="code-module-header"><span>📄 ${m.codeBlock.lang||'code'}</span><span style="margin-left:auto;font-size:10px;color:#8b949e">${m.codeBlock.code.split('\n').length}行</span></div><div class="code-module-body">${esc(m.codeBlock.code)}</div><div class="code-module-actions"><button class="code-btn" onclick="copyCode(${i})">📋 复制</button>${m.codeBlock.isHTML?`<button class="code-btn preview" onclick="previewCode(${i})">👁️ 预览</button>`:''}</div><div id="preview-${i}" class="preview-iframe" style="display:none"></div></div>`
    }
    h+=`<div class="msg-content">${esc(m.content)}</div></div></div>`
    return h
  }).join('')
  area.scrollTop = area.scrollHeight
}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/```(\w*)\n([\s\S]*?)```/g,'').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'</p><p>'):''}
function copyCode(i){const c=curChat.msgs[i]?.codeBlock?.code;if(c){navigator.clipboard.writeText(c);toast('已复制','ok')}}
function previewCode(i){const el=document.getElementById('preview-'+i);if(!el)return;el.style.display='block';el.innerHTML='<iframe srcdoc="'+curChat.msgs[i].codeBlock.code.replace(/"/g,'&quot;')+'" style="width:100%;height:300px;border:none"></iframe>'}

// ============ 辅助 ============
function ts(){return new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function newChat(){curChat.msgs=[];renderAll();renderMsgs()}
function quickStart(type){
  if(type==='prd'){curChat.agent='_prd';mode='single';curChat.msgs=[];renderAll();renderMsgs();document.getElementById('msgInput').value='帮我写一份AI智能胸牌V2.0版本的产品需求文档'}
  else if(type==='group'){showGroupChat()}
  else if(type==='code'){curChat.agent='_coder';mode='code';curChat.msgs=[];renderAll();renderMsgs();document.getElementById('msgInput').value='写一个漂亮的登录页面，带渐变背景'}
}

function saveCfg(){cfg.apiKey=document.getElementById('apiKey').value.trim();cfg.apiOAI=document.getElementById('apiBaseOAI').value.trim();cfg.apiClaude=document.getElementById('apiBaseClaude').value.trim();localStorage.setItem('ai_cfg',JSON.stringify(cfg));document.getElementById('settingsModal').style.display='none';toast('已保存','ok')}
function toast(m,t='i'){const c=document.getElementById('toastContainer');const e=document.createElement('div');e.className=`toast ${t}`;e.textContent=m;c.appendChild(e);setTimeout(()=>e.remove(),2500)}
function init(){if(!cfg.apiKey&&!cfg.apiOAI){document.getElementById('settingsModal').style.display='flex';setTimeout(()=>document.getElementById('settingsModal').style.display='none',8000)};renderAll();renderMsgs()}
init()
</script>
